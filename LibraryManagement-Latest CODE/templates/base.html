<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Library Management System</title>

  <!-- Bootstrap 4 CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <style>
    /* ── Reset ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fdf8f0;
      padding-top: 64px; /* offset for fixed navbar */
    }

    /* ── Navbar wrapper ── */
    .lms-navbar {
      background: #ffffff;
      border-bottom: 2px solid #e8d5a3;
      height: 64px;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1030;
    }

    /* ── Brand ── */
    .lms-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .lms-brand:hover {
      text-decoration: none;
    }

    .lms-brand-icon {
      width: 36px;
      height: 36px;
      background: #b8860b;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .lms-brand-text {
      font-size: 15px;
      font-weight: 600;
      color: #1a2a4a;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .lms-brand-sub {
      font-size: 10px;
      color: #b8860b;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 400;
    }

    /* ── Nav links ── */
    .lms-nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .lms-nav-links a {
      color: #4a5568;
      text-decoration: none;
      font-size: 13.5px;
      padding: 7px 14px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.01em;
      transition: background 0.15s, color 0.15s;
      border: 0.5px solid transparent;
    }

    .lms-nav-links a:hover {
      color: #1a2a4a;
      background: #f5edd8;
      text-decoration: none;
    }

    .lms-nav-links a.active {
      color: #7a5800;
      background: #fdf3d8;
      border-color: #e8d5a3;
      font-weight: 500;
    }

    .lms-divider {
      width: 0.5px;
      height: 20px;
      background: #ddd;
      margin: 0 4px;
      flex-shrink: 0;
    }
    .lms-badge {
      font-size: 10px;
      background: #fdf3d8;
      color: #7a5800;
      border: 0.5px solid #e8d5a3;
      border-radius: 4px;
      padding: 1px 5px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .lms-toggler {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
    }

    .lms-toggler span {
      display: block;
      width: 22px;
      height: 2px;
      background: #4a5568;
      border-radius: 2px;
      transition: all 0.2s;
    }

    /* ── Mobile menu ── */
    .lms-mobile-menu {
      display: none;
      position: fixed;
      top: 64px;
      left: 0;
      right: 0;
      background: #ffffff;
      border-bottom: 2px solid #e8d5a3;
      padding: 0.75rem 1.5rem 1rem;
      z-index: 1029;
      flex-direction: column;
      gap: 4px;
    }
    .lms-mobile-menu.open {
      display: flex;
    }
    .lms-mobile-menu a {
      color: #4a5568;
      text-decoration: none;
      font-size: 14px;
      padding: 9px 12px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 0.5px solid transparent;
      transition: background 0.15s, color 0.15s;
    }
    .lms-mobile-menu a:hover {
      color: #1a2a4a;
      background: #f5edd8;
      text-decoration: none;
    }
    .lms-mobile-menu a.active {
      color: #7a5800;
      background: #fdf3d8;
      border-color: #e8d5a3;
      font-weight: 500;
    }
    @media (max-width: 768px) {
      .lms-nav-links {
        display: none;
      }
      .lms-toggler {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <nav class="lms-navbar">
    <a href="/" class="lms-brand">
      <div class="lms-brand-icon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="5" height="7" rx="1" fill="#fff"/>
          <rect x="9" y="3" width="5" height="7" rx="1" fill="#fff"/>
          <rect x="3" y="12" width="11" height="2" rx="1" fill="#fff"/>
          <rect x="3" y="15" width="8" height="2" rx="1" fill="rgba(255,255,255,0.55)"/>
        </svg>
      </div>
      <div>
        <div class="lms-brand-text">Library Management</div>
        <div class="lms-brand-sub">System</div>
      </div>
    </a>

    <ul class="lms-nav-links">
      <li>
        <a href="/" class="active">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M1 7L7 1l6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3 5.5V12a.5.5 0 00.5.5h2.5V9h2v3.5H11a.5.5 0 00.5-.5V5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Home
        </a>
      </li>
      <li>
        <a href="{% url 'adminclick' %}">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <circle cx="7" cy="4.5" r="2.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M2 12c0-2.761 2.239-4 5-4s5 1.239 5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Admin
          <span class="lms-badge">Panel</span>
        </a>
      </li>
      <li>
        <a href="{% url 'studentclick' %}">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <circle cx="7" cy="4.5" r="2.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M2 12c0-2.761 2.239-4 5-4s5 1.239 5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Student
        </a>
      </li>
    </ul>

    <button class="lms-toggler" id="lmsToggler" aria-label="Toggle navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </nav>

  <div class="lms-mobile-menu" id="lmsMobileMenu">
    <a href="/" class="active">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M1 7L7 1l6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3 5.5V12a.5.5 0 00.5.5h2.5V9h2v3.5H11a.5.5 0 00.5-.5V5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Home
    </a>
    <a href="{% url 'adminclick' %}">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <circle cx="7" cy="4.5" r="2.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M2 12c0-2.761 2.239-4 5-4s5 1.239 5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Admin
    </a>
    <a href="{% url 'studentclick' %}">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <circle cx="7" cy="4.5" r="2.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M2 12c0-2.761 2.239-4 5-4s5 1.239 5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Student
    </a>
  </div>

  {% block content %}
  {% endblock %}

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const toggler = document.getElementById('lmsToggler');
    const mobileMenu = document.getElementById('lmsMobileMenu');
    toggler.addEventListener('click', function () {
      mobileMenu.classList.toggle('open');
    });
    mobileMenu.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', function () {
        mobileMenu.classList.remove('open');
      });
    });
  </script>

</body>
</html>
